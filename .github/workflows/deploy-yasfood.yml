name: YasFood · banco + deploy (Cloudflare)

# Mesmo esquema dos outros sistemas: GitHub Actions → Cloudflare Workers.
# O banco vai no projeto Supabase Pro (xrncvhzxjmddqluxoosu), isolado no schema "yasfood".
on:
  push:
    branches: [main, claude/hopeful-meitner-3uxt2e]
    paths:
      - 'yasfood/**'
      - '.github/workflows/deploy-yasfood.yml'
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Definir/trocar a senha da Yasmim (opcional, não fica salva)'
        required: false
        type: string

env:
  SUPABASE_PROJECT_REF: xrncvhzxjmddqluxoosu
  ADMIN_EMAIL: yasmimaguiarsc@gmail.com

jobs:
  database:
    name: Banco (migrations, schema exposto, admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          run_sql () {
            echo "▶ $1"
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json -o /tmp/out.json
            head -c 300 /tmp/out.json; echo
          }
          for f in yasfood/supabase/migrations/*.sql; do run_sql "$f"; done

      - name: Diagnóstico de custos (só leitura, sai no log)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' yasfood/supabase/diag/custos.sql > /tmp/body.json
          curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json -o /tmp/diag.json
          jq -c '.[0].diag' /tmp/diag.json

      - name: Definir senha da Yasmim (só no disparo manual com senha)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.admin_password != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_PASSWORD"
          jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" \
            'def q: "'"'"'" + gsub("'"'"'";"'"'"''"'"'") + "'"'"'"; {query: ("update auth.users set encrypted_password = crypt(" + ($p|q) + ", gen_salt('"'"'bf'"'"')), updated_at = now() where lower(email) = " + ($e|q) + ";")}' > /tmp/body.json
          curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json -o /dev/null
          rm -f /tmp/body.json
          echo "senha definida para $ADMIN_EMAIL"

      - name: Expor o schema yasfood na Data API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Nunca imprimir a resposta inteira: ela contém o jwt_secret do projeto.
          curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o /tmp/postgrest.json
          schemas=$(jq -r '.db_schema' /tmp/postgrest.json)
          echo "schemas expostos: $schemas"
          if echo ",$schemas," | tr -d ' ' | grep -q ',yasfood,'; then
            echo "yasfood já exposto"
          else
            jq --arg s "$schemas, yasfood" '{db_schema: $s, max_rows: .max_rows, db_extra_search_path: .db_extra_search_path}' /tmp/postgrest.json > /tmp/pr.json
            curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/pr.json -o /dev/null
            echo "yasfood exposto"
          fi
          rm -f /tmp/postgrest.json /tmp/pr.json

  deploy:
    name: Build & Deploy YasFood to Cloudflare
    needs: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yasfood
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yasfood/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Obter URL e anon key do projeto (Management API)
        id: sb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          url="https://$SUPABASE_PROJECT_REF.supabase.co"
          key=$(curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name=="anon") | .api_key')
          [ -n "$key" ] && [ "$key" != "null" ] || { echo "::error::anon key não encontrada"; exit 1; }
          echo "::add-mask::$key"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "projeto: $url"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.key }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.22.6

      - name: Deploy da função de leitura de prints (Edge Function)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # a CLI resolve as funções a partir da pasta supabase/ da raiz (config.toml do Nexus):
          # copia a função do YasFood pra lá só no momento do deploy
          for fn in yasfood/supabase/functions/*/; do
            name=$(basename "$fn")
            rm -rf "supabase/functions/$name"
            cp -r "$fn" "supabase/functions/$name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done
          # chave da IA: só grava se o secret existir no repositório (a do projeto pode já estar lá pelo Nexus)
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
            echo "ANTHROPIC_API_KEY gravada no projeto"
          else
            echo "secret ANTHROPIC_API_KEY ausente no repositório; usando a que já existir no projeto"
          fi
          # a chave existe no projeto? (só o nome, nunca o valor)
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q "ANTHROPIC_API_KEY"; then echo "projeto tem ANTHROPIC_API_KEY"; else echo "::warning::projeto SEM ANTHROPIC_API_KEY: a leitura de prints vai falhar até cadastrar"; fi

      - name: Deploy to Cloudflare Workers
        id: wrangler
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wrangler.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "URL: $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Gravar o endereço do site nas configurações (links de rastreio)
        if: steps.wrangler.outputs.url != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.wrangler.outputs.url }}
        run: |
          jq -n --arg u "$SITE_URL" 'def q: "'"'"'" + gsub("'"'"'";"'"'"''"'"'") + "'"'"'"; {query: ("update yasfood.settings set site_url = " + ($u|q) + " where id = 1 and site_url = '"'"''"'"';")}' > /tmp/body.json
          curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json
          echo

      - name: Autorizar o site nos redirects do Auth (recuperação de senha)
        if: steps.wrangler.outputs.url != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.wrangler.outputs.url }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o /tmp/auth.json
          cur=$(jq -r '.uri_allow_list // ""' /tmp/auth.json)
          want="$SITE_URL/**"
          if echo ",$cur," | tr -d ' ' | grep -qF ",$want,"; then
            echo "redirect já autorizado"
          else
            new=$([ -n "$cur" ] && echo "$cur,$want" || echo "$want")
            jq -n --arg l "$new" '{uri_allow_list: $l}' > /tmp/auth-patch.json
            curl -sS --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/auth-patch.json -o /dev/null
            echo "redirect autorizado: $want"
          fi
          rm -f /tmp/auth.json /tmp/auth-patch.json

      - name: Verificar site e API ao vivo
        if: steps.wrangler.outputs.url != ''
        env:
          SITE_URL: ${{ steps.wrangler.outputs.url }}
          SUPABASE_URL: ${{ steps.sb.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.sb.outputs.key }}
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' "$SITE_URL/")
          echo "site: HTTP $code"; [ "$code" = "200" ]
          grep -q 'id="root"' /tmp/index.html
          H=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "public_settings: $(curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/public_settings?select=business_name,site_url,is_open,pix_key,whatsapp" "${H[@]}" -H 'Accept-Profile: yasfood')"
          prods=$(curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/products?select=name,price" "${H[@]}" -H 'Accept-Profile: yasfood')
          echo "produtos: $prods"; [ "$(echo "$prods" | jq length)" -ge 1 ]
          avail=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/availability" "${H[@]}" -H 'Content-Profile: yasfood' -H 'Content-Type: application/json' \
                  -d "{\"p_from\":\"$(date -u +%F)\",\"p_to\":\"$(date -u -d '+7 days' +%F)\"}")
          echo "agenda (7 dias): $(echo "$avail" | jq -c '[.[] | {day, remaining, bookable}]')"
          # dados privados precisam vir vazios/negados pro anônimo
          for t in settings orders customers transactions; do
            r=$(curl -sS -o /tmp/r.json -w '%{http_code}' "$SUPABASE_URL/rest/v1/$t?select=*" "${H[@]}" -H 'Accept-Profile: yasfood')
            n=$(jq 'if type=="array" then length else -1 end' /tmp/r.json 2>/dev/null || echo -1)
            echo "anon -> $t: HTTP $r, linhas: $n"
            if [ "$r" = "200" ] && [ "$n" != "0" ]; then echo "::error::anônimo conseguiu ler $t"; exit 1; fi
          done
          echo "verificação ok"
