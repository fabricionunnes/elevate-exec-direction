name: YasFood · banco + deploy (Cloudflare)

# Mesmo esquema dos outros sistemas: GitHub Actions → Cloudflare Workers.
# O banco vai no projeto Supabase Pro (xrncvhzxjmddqluxoosu), isolado no schema "yasfood".
on:
  push:
    branches: [main, claude/hopeful-meitner-3uxt2e]
    paths:
      - 'yasfood/**'
      - '.github/workflows/deploy-yasfood.yml'
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Definir/trocar a senha da Yasmim (opcional, não fica salva)'
        required: false
        type: string

env:
  SUPABASE_PROJECT_REF: xrncvhzxjmddqluxoosu
  ADMIN_EMAIL: yasmimaguiarsc@gmail.com

jobs:
  database:
    name: Banco (migrations, schema exposto, admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          run_sql () {
            echo "▶ $1"
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json -o /tmp/out.json
            head -c 300 /tmp/out.json; echo
          }
          for f in yasfood/supabase/migrations/*.sql; do run_sql "$f"; done

      - name: Definir senha da Yasmim (só no disparo manual com senha)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.admin_password != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_PASSWORD"
          jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" \
            '{query: ("update auth.users set encrypted_password = crypt(" + ($p|tojson|gsub("\"";"'"'"'")) + ", gen_salt('"'"'bf'"'"')), updated_at = now() where lower(email) = " + ($e|tojson|gsub("\"";"'"'"'")) + ";")}' > /tmp/body.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json -o /dev/null
          rm -f /tmp/body.json
          echo "senha definida para $ADMIN_EMAIL"

      - name: Expor o schema yasfood na Data API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cur=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "atual: $cur"
          schemas=$(echo "$cur" | jq -r '.db_schema')
          case ",$(echo "$schemas" | tr -d ' ")," in
            *,yasfood,*) echo "yasfood já exposto";;
            *)
              echo "$cur" | jq --arg s "$schemas, yasfood" '{db_schema: $s, max_rows: .max_rows, db_extra_search_path: .db_extra_search_path}' > /tmp/pr.json
              curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/pr.json
              echo; echo "yasfood exposto";;
          esac

  deploy:
    name: Build & Deploy YasFood to Cloudflare
    needs: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yasfood
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yasfood/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        id: wrangler
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wrangler.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "URL: $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Gravar o endereço do site nas configurações (links de rastreio)
        if: steps.wrangler.outputs.url != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.wrangler.outputs.url }}
        run: |
          jq -n --arg u "$SITE_URL" '{query: ("update yasfood.settings set site_url = " + ($u|tojson|gsub("\"";"'"'"'")) + " where id = 1 and site_url = '"'"''"'"';")}' > /tmp/body.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json
          echo
