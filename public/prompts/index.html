<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prompts dos Agentes</title>
<meta name="description" content="Prompts da Secretária Comercial e do Resumo de Consulta para copiar." />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}h1,h2,p,pre{margin:0}
/* Layout: coluna única de leitura no celular, um cartão por prompt com botão de copiar sempre à mão. */
:root {
  --bg: #F5F0E4; --surface: #FBF8F0; --fg: #131210; --muted: #5F594E;
  --line: #DDD3BD; --accent: #8A5F00; --btn-bg: #131210; --btn-fg: #F5F0E4;
  --font: 'DM Sans', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131210; --surface: #1E1C19; --fg: #F5F0E4; --muted: #B9B2A3;
    --line: #38342D; --accent: #E0A526; --btn-bg: #E0A526; --btn-fg: #131210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131210; --surface: #1E1C19; --fg: #F5F0E4; --muted: #B9B2A3;
  --line: #38342D; --accent: #E0A526; --btn-bg: #E0A526; --btn-fg: #131210; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 720px; margin-inline: auto; padding-inline: 20px; padding-block: 32px 64px; display: flex; flex-direction: column; gap: 32px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
header { display: flex; flex-direction: column; gap: 10px; }
header p, .how { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 10px; }
nav a { color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; text-decoration: none; font-weight: 600; font-size: 15px; }
section { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 28px; scroll-margin-top: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
button { font-family: var(--font); font-size: 16px; font-weight: 700; background: var(--btn-bg); color: var(--btn-fg); border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; }
button:focus-visible, nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
pre { font-family: var(--font); font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; user-select: all; -webkit-user-select: all; }
footer { color: var(--muted); font-size: 15px; border-top: 1px solid var(--line); padding-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
<header>
<p class="eyebrow">Consultórios Inteligentes · Construindo seus Agentes</p>
<h1>Prompts dos Agentes</h1>
<p>Escolha o agente para abrir o prompt e copiar.</p>
</header>
<nav aria-label="Prompts">
<a href="/prompts/secretaria/">Secretária Comercial</a>
<a href="/prompts/consulta/">Resumo de Consulta</a>
<a href="/prompts/confirmacao/">Confirmação e No-show</a>
<a href="/prompts/orcamento/">Orçamento em Aberto</a>
<a href="/prompts/reativacao/">Reativação de Pacientes</a>
<a href="/prompts/pos-consulta/">Pós-consulta</a>
</nav>
<footer>Fabrício Nunnes · @ofabricionunnes</footer>
</div>
</body>
</html>
